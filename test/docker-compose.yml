services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: mhoo_core_phase0
      POSTGRES_PASSWORD: phase0-migrator-local-only
      POSTGRES_USER: core_migrator
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core_migrator -d mhoo_core_phase0"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - phase0-postgres:/var/lib/postgresql

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: phase0-local-only
      MINIO_ROOT_PASSWORD: phase0-local-only-secret
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - phase0-minio:/data

volumes:
  phase0-postgres:
    name: mhoo-core-phase0-postgres
  phase0-minio:
    name: mhoo-core-phase0-minio
